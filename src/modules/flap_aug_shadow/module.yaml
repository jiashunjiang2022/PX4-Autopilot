module_name: flap_aug_shadow

parameters:
    - group: Flap V4 Shadow
      definitions:
        FLAP_V4_ENABLE:
            description:
                short: Enable V4 specimen-prior Shadow diagnostics
                long: |
                    Enables computation and publication of V4 specimen-prior diagnostic state only.
                    This parameter cannot enable actuator augmentation and has no control-path effect.
            type: boolean
            default: false
            category: System

        FLAP_SLOW_EN:
            description:
                short: Enable B2b Roll-I transfer experiment
                long: Enables the guarded B2b Roll-I burden transfer. Transfer authority remains zero while FLAP_B2B_CAP is zero. Fast injection and delta_b remain disabled.
            type: boolean
            default: false
            category: System

        FLAP_SLOW_B0:
            description:
                short: Legacy fixed-b0 tail coordinate
                long: Legacy specimen-prior value retained for audit compatibility. It is not used as a B2b raw-I target and provides no authority in the B2b path.
            type: float
            default: 0.0
            min: -0.22
            max: 0.22
            decimal: 6
            category: System

        FLAP_SLOW_SLEW:
            description:
                short: Legacy fixed-b0 tail ramp rate
                long: Legacy tail-coordinate value retained for audit compatibility. It is not interpreted as raw-I per second.
            type: float
            default: 0.02
            min: 0.005
            max: 0.05
            decimal: 3
            category: System

        FLAP_B2B_CAP:
            description:
                short: B2b transferred Roll-I cap
                long: Maximum existing Roll integrator burden transferable into the B2b raw-I state. Zero disables transfer authority. Nonzero values are test and SITL only, not flight frozen.
            type: float
            default: 0.0
            min: 0.0
            max: 1.0
            decimal: 4
            category: System

        FLAP_B2B_SLEW:
            description:
                short: B2b normal raw-I slew
                long: Normal transfer-in and exact transfer-out rate in raw-I per second. This does not use legacy tail-coordinate units.
            type: float
            default: 0.02
            min: 0.001
            max: 1.0
            decimal: 4
            category: System

        FLAP_B2B_SAFE:
            description:
                short: B2b safety raw-I slew
                long: Safety-exit removal rate in raw-I per second. Continuity is best effort. This value is test and SITL only, not flight frozen.
            type: float
            default: 0.20
            min: 0.01
            max: 2.0
            decimal: 3
            category: System

        FLAP_V4_B_PRIOR:
            description:
                short: V4 specimen prior diagnostic value
                long: |
                    Fixed specimen-prior diagnostic artifact value for the current evaluation block.
                    It is logged only; it is not a trim command and is never sent to a controller or actuator.
            type: float
            default: 0.0
            min: -2.0
            max: 2.0
            decimal: 6
            category: System
