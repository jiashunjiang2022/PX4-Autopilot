module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_ARSP_THR:
      description:
        short: Airspeed fusion threshold
        long: Airspeed data is fused for wind estimation if above this threshold.
          Set to 0 to disable airspeed fusion. For reliable wind estimation both sideslip
          (see EKF2_FUSE_BETA) and airspeed fusion should be enabled. Only applies
          to fixed-wing vehicles (or VTOLs in fixed-wing mode).
      type: float
      default: 0.0
      min: 0.0
      unit: m/s
      decimal: 1
    EKF2_ASP_DELAY:
      description:
        short: Airspeed measurement delay relative to IMU measurements
      type: float
      default: 100
      min: 0
      max: 300
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_TAS_GATE:
      description:
        short: Gate size for TAS fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_EAS_NOISE:
      description:
        short: Measurement noise for airspeed fusion
      type: float
      default: 1.4
      min: 0.5
      max: 5.0
      unit: m/s
      decimal: 1
    EKF2_ASP_QLTY:
      description:
        short: Enable airspeed quality estimation
        long: If enabled, evaluate airspeed quality using flap-frequency spectral content and
          airspeed rate of change, then gate fusion and adapt measurement noise.
      type: int32
      default: 0
      min: 0
      max: 1
      decimal: 0
    EKF2_ASP_TW:
      description:
        short: Airspeed quality spectral window length
      type: float
      default: 2.0
      min: 0.5
      max: 5.0
      unit: s
      decimal: 1
    EKF2_ASP_SFS:
      description:
        short: Airspeed quality spectral sampling rate
        long: Expected sampling rate of the spectral input signal for airspeed quality estimation.
          The flap center frequency is clamped below Nyquist to reduce aliasing.
      type: float
      default: 10.0
      min: 2.0
      max: 50.0
      unit: Hz
      decimal: 1
    EKF2_ASP_SWIN:
      description:
        short: Airspeed quality spectral window (new)
        long: Spectral ratio is reported as NaN until this full window is collected.
      type: float
      default: 4.0
      min: 1.0
      max: 10.0
      unit: s
      decimal: 1
    EKF2_ASP_DF:
      description:
        short: Airspeed quality spectral band half-width
      type: float
      default: 0.5
      min: 0.1
      max: 2.0
      unit: Hz
      decimal: 1
    EKF2_ASP_QA:
      description:
        short: Airspeed quality spectral weight
      type: float
      default: 0.7
      min: 0.0
      max: 1.0
      decimal: 2
    EKF2_ASP_QB:
      description:
        short: Airspeed quality rate weight
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
      decimal: 2
    EKF2_ASP_DV0:
      description:
        short: Airspeed rate normalization
      type: float
      default: 5.0
      min: 0.1
      max: 20.0
      unit: m/s^2
      decimal: 1
    EKF2_ASP_RMAX:
      description:
        short: Airspeed noise max multiplier
      type: float
      default: 5.0
      min: 1.0
      max: 20.0
      decimal: 1
    EKF2_ASP_QON:
      description:
        short: Airspeed quality gate on threshold
      type: float
      default: 0.6
      min: 0.0
      max: 1.0
      decimal: 2
    EKF2_ASP_QOFF:
      description:
        short: Airspeed quality gate off threshold
      type: float
      default: 0.4
      min: 0.0
      max: 1.0
      decimal: 2
    EKF2_ASP_QTAU:
      description:
        short: Airspeed quality smoothing time constant
      type: float
      default: 0.25
      min: 0.0
      max: 2.0
      unit: s
      decimal: 2
    EKF2_ASP_TOFF:
      description:
        short: Airspeed quality gate-off persistence time
      type: float
      default: 0.20
      min: 0.0
      max: 2.0
      unit: s
      decimal: 2
    EKF2_ASP_TON:
      description:
        short: Airspeed quality gate-on persistence time
      type: float
      default: 0.30
      min: 0.0
      max: 2.0
      unit: s
      decimal: 2
    EKF2_ASP_THLD:
      description:
        short: Airspeed quality gate minimum hold time
      type: float
      default: 0.25
      min: 0.0
      max: 2.0
      unit: s
      decimal: 2
    EKF2_FLAP_F_ON:
      description:
        short: Flap active enter frequency threshold
      type: float
      default: 1.0
      min: 0.1
      max: 10.0
      unit: Hz
      decimal: 2
    EKF2_FLAP_F_OFF:
      description:
        short: Flap active exit frequency threshold
      type: float
      default: 0.6
      min: 0.0
      max: 10.0
      unit: Hz
      decimal: 2
    EKF2_FLAP_T_ON:
      description:
        short: Flap active enter persistence
      type: float
      default: 0.4
      min: 0.0
      max: 5.0
      unit: s
      decimal: 2
    EKF2_FLAP_T_OFF:
      description:
        short: Flap active exit persistence
      type: float
      default: 1.5
      min: 0.0
      max: 5.0
      unit: s
      decimal: 2
    EKF2_FLAP_T_TO:
      description:
        short: Flap frequency timeout
      type: float
      default: 0.8
      min: 0.1
      max: 5.0
      unit: s
      decimal: 2
