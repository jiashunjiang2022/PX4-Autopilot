module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_ARSP_THR:
      description:
        short: Airspeed fusion threshold
        long: Airspeed data is fused for wind estimation if above this threshold.
          Set to 0 to disable airspeed fusion. For reliable wind estimation both sideslip
          (see EKF2_FUSE_BETA) and airspeed fusion should be enabled. Only applies
          to fixed-wing vehicles (or VTOLs in fixed-wing mode).
      type: float
      default: 0.0
      min: 0.0
      unit: m/s
      decimal: 1
    EKF2_ASP_DELAY:
      description:
        short: Airspeed measurement delay relative to IMU measurements
      type: float
      default: 100
      min: 0
      max: 300
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_TAS_GATE:
      description:
        short: Gate size for TAS fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_EAS_NOISE:
      description:
        short: Measurement noise for airspeed fusion
      type: float
      default: 1.4
      min: 0.5
      max: 5.0
      unit: m/s
      decimal: 1
    EKF2_ASP_QLTY:
      description:
        short: Enable airspeed quality estimation
        long: If enabled, evaluate airspeed quality using flap-frequency spectral content and
          airspeed rate of change, then gate fusion and adapt measurement noise.
      type: int32
      default: 0
      min: 0
      max: 1
      decimal: 0
    EKF2_ASP_TW:
      description:
        short: Airspeed quality spectral window length
      type: float
      default: 2.0
      min: 0.5
      max: 5.0
      unit: s
      decimal: 1
    EKF2_ASP_DF:
      description:
        short: Airspeed quality spectral band half-width
      type: float
      default: 0.5
      min: 0.1
      max: 2.0
      unit: Hz
      decimal: 1
    EKF2_ASP_QA:
      description:
        short: Airspeed quality spectral weight
      type: float
      default: 0.7
      min: 0.0
      max: 1.0
      decimal: 2
    EKF2_ASP_QB:
      description:
        short: Airspeed quality rate weight
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
      decimal: 2
    EKF2_ASP_DV0:
      description:
        short: Airspeed rate normalization
      type: float
      default: 5.0
      min: 0.1
      max: 20.0
      unit: m/s^2
      decimal: 1
    EKF2_ASP_RMAX:
      description:
        short: Airspeed noise max multiplier
      type: float
      default: 5.0
      min: 1.0
      max: 20.0
      decimal: 1
    EKF2_ASP_QON:
      description:
        short: Airspeed quality gate on threshold
      type: float
      default: 0.6
      min: 0.0
      max: 1.0
      decimal: 2
    EKF2_ASP_QOFF:
      description:
        short: Airspeed quality gate off threshold
      type: float
      default: 0.4
      min: 0.0
      max: 1.0
      decimal: 2
