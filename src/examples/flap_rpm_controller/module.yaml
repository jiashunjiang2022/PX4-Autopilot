module_name: Flap RPM Controller

parameters:
  - group: FlapRPM
    definitions:
      FRP_SLOT:
        description:
          short: Actuator Set slot index (1..6)
          long: |
            Which Actuator Set parameter (1..6) to drive for the flapping motor.
            The physical output must be mapped to 'Peripheral via Actuator SetX' accordingly.
        type: int32
        min: 1
        max: 6
        default: 1

      FRP_MIN_HZ:
        description:
          short: Minimum flapping frequency at throttle=0
        type: float
        unit: Hz
        min: 0.0
        max: 200.0
        decimal: 2
        default: 0.0

      FRP_MAX_HZ:
        description:
          short: Maximum flapping frequency at throttle=1
        type: float
        unit: Hz
        min: 0.0
        max: 400.0
        decimal: 2
        default: 5.0

      FRP_THR_DB:
        description:
          short: Throttle deadband before mapping
          long: |
            Portion of RC throttle [0..1] ignored at the bottom end. Effective
            throttle becomes (thr - DB)/(1-DB). This reduces sensitivity near low end.
        type: float
        min: 0.0
        max: 0.5
        decimal: 2
        default: 0.00

      FRP_THR_EXP:
        description:
          short: Throttle expo (gamma) for mapping
          long: |
            Nonlinear mapping exponent. Effective throttle is pow(thr_eff, gamma).
            gamma > 1 compresses low end (less sensitive), gamma < 1 expands it.
        type: float
        min: 0.5
        max: 5.0
        decimal: 2
        default: 2.00

      FRP_THR_MIN:
        description:
          short: RC throttle lower bound for mapping
          long: |
            Clamped lower bound in [0..1] before mapping. Effective throttle is
            (clamp(thr, MIN, MAX) - MIN)/(MAX - MIN). Use with FRP_THR_MAX to
            map only a subrange of the stick travel.
        type: float
        min: 0.0
        max: 1.0
        decimal: 2
        default: 0.00

      FRP_THR_MAX:
        description:
          short: RC throttle upper bound for mapping
          long: |
            Clamped upper bound in [0..1] before mapping. Together with
            FRP_THR_MIN, this defines the stick window that maps to the full
            frequency range. Values below MIN map to FRP_MIN_HZ; values above
            MAX map to FRP_MAX_HZ.
        type: float
        min: 0.0
        max: 1.0
        decimal: 2
        default: 1.00

      FRP_SP_SLEW:
        description:
          short: Setpoint slew rate limit
          long: |
            Maximum change rate of frequency setpoint in Hz/s to avoid sudden jumps.
            0 disables slew limiting.
        type: float
        unit: Hz/s
        min: 0.0
        max: 50.0
        decimal: 2
        default: 1.00

      FRP_KP:
        description:
          short: RPM controller proportional gain
        type: float
        min: 0.0
        max: 5.0
        decimal: 3
        default: 0.3

      FRP_KI:
        description:
          short: RPM controller integral gain
        type: float
        min: 0.0
        max: 5.0
        decimal: 3
        default: 0.1

      FRP_KD:
        description:
          short: RPM controller derivative gain
        type: float
        min: 0.0
        max: 5.0
        decimal: 3
        default: 0.0

      FRP_U_MIN:
        description:
          short: Output lower limit (normalized)
        type: float
        min: 0.0
        max: 1.0
        decimal: 3
        default: 0.0

      FRP_U_MAX:
        description:
          short: Output upper limit (normalized)
        type: float
        min: 0.0
        max: 1.0
        decimal: 3
        default: 1.0

      FRP_RATE_HZ:
        description:
          short: Controller run rate
        type: float
        unit: Hz
        min: 5.0
        max: 200.0
        decimal: 1
        default: 50.0

      FRP_TIMEOUT_MS:
        description:
          short: RPM feedback timeout
          long: Consider RPM invalid if no update was received within this time.
        type: int32
        unit: ms
        min: 50
        max: 5000
        default: 300
