module_name: AS5600 Encoder

parameters:
  - group: Encoder
    definitions:
      FLAP_RATIO:
        description:
          short: AS5600 drive revolutions per flapping cycle
          long: |
            Mechanical ratio between AS5600 encoder shaft revolutions and one flapping drive cycle.
            The AS5600 wing_phase topic uses this to convert accumulated encoder counts into relative
            flapping phase. This does not define an absolute mechanical zero.
        type: float
        min: 0.01
        max: 1000.0
        decimal: 2
        increment: 0.01
        default: 7.5
