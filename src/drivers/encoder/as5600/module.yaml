module_name: AS5600 Encoder

parameters:
  - group: Encoder
    definitions:
      FLAP_RATIO:
        description:
          short: AS5600 drive revolutions per flapping cycle
          long: |
            Mechanical ratio between AS5600 encoder shaft revolutions and one flapping drive cycle.
            The Hall-indexed wing_phase module uses this together with encoder_count and Hall pulses
            to convert accumulated encoder counts into flapping phase. Hall defines the mechanical zero.
        type: float
        min: 0.01
        max: 1000.0
        decimal: 2
        increment: 0.01
        default: 7.5
